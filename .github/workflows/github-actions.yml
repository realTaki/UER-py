name: aijiajia generation smoke test

on:
  push:
    branches: [aijiajia]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6,<3'
          python -m pip install numpy packaging regex six sentencepiece jieba
      - name: Test Chinese generation paths without external models or data
        run: python tests/test_aijiajia_smoke.py
